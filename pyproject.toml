[build-system]
requires = ['setuptools>=69']
build-backend = 'setuptools.build_meta'

[project]
name = 'verna'
version = '0.1.1'
description = 'CLI tools for lexeme cards, translation, and Telegram delivery'
readme = 'README.md'
requires-python = '>=3.12'
dependencies = [
  'psycopg[binary]==3.2.10',
  'openai==2.9.0',
  'configargparse==1.7.1',
  'python-telegram-bot==22.6',
  'platformdirs==4.4.0',
  'prompt_toolkit==3.0.52',
  'pydantic==2.13.4',
  'Jinja2==3.1.6',
  'lingua-language-detector==2.2.0',
]
authors = [
  { name = 'igrmk' }
]
license = { text = 'MIT' }

[project.scripts]
verna = 'verna.verna:main'
verna-cards = 'verna.random_cards:main'
verna-edit = 'verna.edit:main'

[dependency-groups]
dev = [
  'mypy==1.18.2',
  'ruff==0.15.12',
  'PyYAML==6.0.3',
  'types-PyYAML==6.0.12.20250915',
]

[tool.setuptools]
packages = ['verna']

[tool.setuptools.package-data]
verna = ['verna.ini']

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
